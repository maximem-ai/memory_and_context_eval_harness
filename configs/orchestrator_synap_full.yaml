# Multi-Dataset Orchestrator — Full Synap Evaluation
# Runs LongMemEval and LoCoMo concurrently against Synap.
# Each dataset gets its own user_id, checkpoint, and output directory.
# Ingestion and evaluation run independently per dataset.

orchestrator:
  # All pipelines share this single Synap adapter instance
  adapter:
    name: "synap"
    module: "adapters.synap_adapter.SynapProvider"
    config_path: "./configs/synap.yaml"

  # LLM settings for evaluation (answering + judging)
  llm:
    model: "gpt-5-mini"
    provider: "openai"
    judge_model: "gpt-5-mini"
    temperature: 0.0

  # Per-benchmark answer prompts are auto-routed:
  #   prompts/{benchmark}_agent.md  if it exists
  #   prompts/qa_agent.md           shared default fallback
  # To force a single prompt for all benchmarks, uncomment:
  # agent_system_prompt_path: "./prompts/qa_agent.md"
  agent_max_iterations: 5

  # Concurrency: how many eval questions to run in parallel per dataset
  eval_concurrency: 3

  # Output root
  output_dir: "./results/orchestrator"

  # Checkpoint root (one file per dataset)
  checkpoint_dir: "./checkpoints/orchestrator"

# ── Dataset Pipelines ─────────────────────────────────────────────
pipelines:
  longmemeval:
    enabled: true
    dataset: "longmemeval"
    user_id: "longmemeval_bench_user"
    ingestion_method: "longterm"
    ingestion_buffer_seconds: 30
    max_records: 0
    max_questions: 0
    retrieval_mode: "fast"
    retrieval_max_results: 100
    warmup_delay_seconds: 10
    batch_ingest: true
    batch_size: 50
    batch_delay_seconds: 2

  locomo:
    enabled: true
    dataset: "locomo"
    user_id: "locomo_bench_user"
    ingestion_method: "longterm"
    ingestion_buffer_seconds: 30
    max_records: 0
    max_questions: 0
    retrieval_mode: "fast"
    retrieval_max_results: 100
    batch_ingest: true
    batch_size: 50
    batch_delay_seconds: 2

# ── Scoring ───────────────────────────────────────────────────────
scoring:
  scorers:
    - "llm_judge"
  run_after_completion: true
