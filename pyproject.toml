[project]
name = "memory-and-context-eval-harness"
version = "0.1.0"
description = "A reproducible benchmarking framework for memory/context systems."
authors = [{name = "Maximem", email = "dev@maximem.ai"}]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "openai",
    "tiktoken",
    "pyyaml",
    "requests",
    "tqdm",
    "python-dotenv",
    "pydantic",
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "httpx",
    "supermemory",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "mem0ai>=0.0.9",
    "zep-cloud>=3.16.0",
    "langchain-google-genai>=4.2.1",
    "maximem-synap>=0.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-requests",
    "types-PyYAML",
]
adapters = [
    "mem0ai",
    "zep-cloud",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runner", "adapters", "datasets", "scorers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"
# One-off research scripts, not library code. Not import-checked in CI.
extend-exclude = ["scripts", "frontend"]

[tool.ruff.lint]
# Correctness only, deliberately not style. Pyflakes (F) catches undefined
# names, unused imports and dead locals, which is the class of bug that let a
# base-class rename sit broken on main for months. E9 catches syntax and IO
# errors. The stylistic rule sets (UP, I, BLE, ...) currently report ~550
# findings across the codebase; turning them on belongs in its own formatting
# PR so it does not bury real failures or churn a review.
select = ["F", "E9"]

[tool.mypy]
strict = true
